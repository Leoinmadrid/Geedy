<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geedy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-shell">
        <canvas id="game" width="640" height="360"></canvas>

        <div class="touch-controls" aria-label="Controles táctiles">
            <button class="touch-btn" id="leftBtn" type="button" aria-label="Mover a la izquierda">←</button>
            <button class="touch-btn" id="rightBtn" type="button" aria-label="Mover a la derecha">→</button>
            <button class="touch-btn jump-btn" id="jumpBtn" type="button" aria-label="Saltar">SALTAR</button>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
